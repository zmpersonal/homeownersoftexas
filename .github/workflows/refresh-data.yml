name: Refresh public data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/Chicago

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh government data snapshots
        run: npm run refresh
      - name: Rebuild static output
        run: npm run build
      - name: Commit refreshed snapshots when changed
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "homeowners-of-texas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated site
          git commit -m "data: refresh public snapshots"
          git push
      - name: Deploy refreshed site to Cloudflare
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
